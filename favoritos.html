<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopedia Hyrule | Sección de favoritos</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script type="module" src="assets/js/firebase.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/transform.js" defer></script>
</head>
<body>
    <header class="cabecera-favoritos">
        <nav class="cabecera-favoritos__herramientas">
            <label class="filtros-favoritos__descripcion">Ordenar por:
                <select class="controles__select">
                    <option value="fecha-desc">Más recientes</option>
                    <option value="fecha-asc">Más antiguos</option>
                    <option value="nombre-asc">A-Z</option>
                    <option value="nombre-desc">Z-A</option>
                </select>
            </label>
            <button class="cabecera-favoritos__boton">Vaciar lista</button>
        </nav>
        <a class="cabecera-favoritos__logo" href="./index.html" aria-label="Volver al inicio">
            <img class="logo__imagen" src="./assets/imgs/triforce-svgrepo-com.svg" alt="Trifuerza">
        </a>
        <h1 class="cabecera-favoritos__titulo">Sección de Favoritos</h1>
        <nav class="cabecera__filtros">
            <p class="filtros__descripcion">Filtrar por categoría:</p>
            <label class="filtros__etiqueta">Juegos
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="juegos" data-categoria="games">
            </label>
            <label class="filtros__etiqueta"> Staff
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="staff" data-categoria="staff">
            </label>
            <label class="filtros__etiqueta">Personajes
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="personajes" data-categoria="characters">
            </label>
            <label class="filtros__etiqueta">Monstruos
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="monstruos" data-categoria="monsters">
            </label>
            <label class="filtros__etiqueta">Jefes
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="jefes" data-categoria="bosses">
            </label>
            <label class="filtros__etiqueta">Mazmorras
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="mazmorras" data-categoria="dungeons">
            </label>
            <label class="filtros__etiqueta">Lugares
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="lugares" data-categoria="places">
            </label>
            <label class="filtros__etiqueta">Objetos
                <input class="filtros__checkbox" type="checkbox" name="entidad" value="objetos" data-categoria="items">
            </label>
        </nav>
    </header>
    <main id="contenedor-favoritos">
    </main>
    <footer class="pie-pagina">
        <nav class="pie-pagina__navegacion">
            <a class="pie-pagina__enlace" href="./index.html">INICIO</a>
            <a class="pie-pagina__enlace" href="./favoritos.html">FAVORITOS</a>
        </nav>
        <p class="pie-pagina__texto">
            &copy; 2026 Enciclopedia Hyrule. Todos los derechos reservados.
            The Legend of Zelda y sus personajes son marcas registradas de Nintendo.
        </p>
    </footer>

</body>
</html>
